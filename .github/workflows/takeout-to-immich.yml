name: Google Takeout → Immich Pipeline

# ─────────────────────────────────────────────────────────────────
# 必要な GitHub Secrets (Azure不要 - rcloneのみ):
#
#   RCLONE_CONFIG              - rclone設定ファイルの内容
#                                (ローカルで `rclone config` 後に
#                                 ~/.config/rclone/rclone.conf をコピー)
#
# AI タグ付けを使う場合のみ追加:
#   GOOGLE_VISION_CREDENTIALS_JSON - Google Cloud サービスアカウントJSON
#   DEEPL_API_KEY                  - DeepL API キー
# ─────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      zip_folder:
        description: 'OneDrive: Google Takeout ZIPのフォルダ'
        required: true
        default: 'Photos/Google Takeout ZIPs'
        type: string
      dst_folder:
        description: 'OneDrive: 出力先フォルダ (Immich外部ライブラリ)'
        required: true
        default: 'Photos/Immich'
        type: string
      rclone_remote:
        description: 'rclone リモート名'
        required: false
        default: 'onedrive'
        type: string
      enable_ai_tagging:
        description: 'Vision AI + DeepL 日本語タグ付けを有効化'
        required: false
        default: false
        type: boolean
      ai_confidence:
        description: 'Vision AI 最小信頼スコア (0.0〜1.0)'
        required: false
        default: '0.75'
        type: string
      deepl_free_tier:
        description: 'DeepL 無料プランを使用'
        required: false
        default: true
        type: boolean
      skip_existing:
        description: '処理済みファイルをスキップ (再実行対応)'
        required: false
        default: true
        type: boolean
      timezone:
        description: 'タイムゾーン (UTC+X, 日本=9)'
        required: false
        default: '9'
        type: string
      dry_run:
        description: 'ドライラン (ファイル一覧のみ、変更なし)'
        required: false
        default: false
        type: boolean

env:
  PYTHON_VERSION: '3.11'

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Job 1: rclone設定 → ZIP解凍 → EXIF修復 → OneDriveアップロード
  # ─────────────────────────────────────────────────────────────────
  extract-and-repair:
    name: ZIP解凍・メタデータ修復
    runs-on: ubuntu-latest
    timeout-minutes: 330

    outputs:
      processed_count: ${{ steps.migration.outputs.processed_count }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'onedrive-photo-migration/requirements.txt'

      - name: システム依存パッケージインストール
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y exiftool rclone

      - name: Pythonパッケージインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r onedrive-photo-migration/requirements.txt

      - name: rclone設定ファイルを復元
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG }}" > ~/.config/rclone/rclone.conf
          echo "rclone config restored"
          rclone listremotes

      - name: rclone接続テスト
        run: |
          rclone lsd ${{ github.event.inputs.rclone_remote || 'onedrive' }}: --max-depth 1 || {
            echo "ERROR: OneDriveに接続できません。RCLONE_CONFIG secretを確認してください。"
            exit 1
          }

      - name: ZIP解凍・EXIF修復・アップロード
        id: migration
        run: |
          cd onedrive-photo-migration

          ARGS="--rclone-remote '${{ github.event.inputs.rclone_remote || 'onedrive' }}'"
          ARGS="$ARGS --src-folder '${{ github.event.inputs.zip_folder }}'"
          ARGS="$ARGS --dst-folder '${{ github.event.inputs.dst_folder }}'"
          ARGS="$ARGS --zip-folder '${{ github.event.inputs.zip_folder }}'"
          ARGS="$ARGS --timezone ${{ github.event.inputs.timezone || '9' }}"
          ARGS="$ARGS --extract-zips"
          ARGS="$ARGS --create-xmp"

          if [ "${{ github.event.inputs.skip_existing }}" != "false" ]; then
            ARGS="$ARGS --skip-existing"
          fi

          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          echo "=============================================="
          echo "Google Takeout → Immich Pipeline v4.0 (rclone)"
          echo "ZIP Source : ${{ github.event.inputs.zip_folder }}"
          echo "Destination: ${{ github.event.inputs.dst_folder }}"
          echo "AI Tagging : ${{ github.event.inputs.enable_ai_tagging }}"
          echo "=============================================="

          eval python onedrive_photo_fixer.py $ARGS

          # レポートからprocessed数を抽出
          PROCESSED=$(python -c "
          import json, sys
          try:
              with open('/tmp/migration_report.json') as f:
                  d = json.load(f)
              print(d.get('summary', {}).get('processed_success', 0))
          except:
              print(0)
          " 2>/dev/null || echo 0)
          echo "processed_count=$PROCESSED" >> $GITHUB_OUTPUT

      - name: レポートをアーティファクトに保存
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migration-report-${{ github.run_id }}
          path: onedrive-photo-migration/migration_report.json
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────
  # Job 2: AI タグ付け (Vision API + DeepL) - 有効化した場合のみ
  # ─────────────────────────────────────────────────────────────────
  ai-tagging:
    name: Vision AI + DeepL 日本語タグ付け
    runs-on: ubuntu-latest
    needs: extract-and-repair
    timeout-minutes: 300
    if: ${{ github.event.inputs.enable_ai_tagging == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'onedrive-photo-migration/requirements.txt'

      - name: システム依存パッケージインストール
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y exiftool rclone

      - name: Pythonパッケージインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r onedrive-photo-migration/requirements.txt

      - name: rclone設定ファイルを復元
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG }}" > ~/.config/rclone/rclone.conf

      - name: DeepL翻訳キャッシュを復元
        uses: actions/cache@v4
        with:
          path: /tmp/translation_cache.json
          key: deepl-cache-${{ github.repository }}-${{ hashFiles('onedrive-photo-migration/adaptive_vision_analyzer.py') }}
          restore-keys: |
            deepl-cache-${{ github.repository }}-

      - name: AI タグ付け実行
        env:
          GOOGLE_VISION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_VISION_CREDENTIALS_JSON }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: |
          cd onedrive-photo-migration

          ARGS="--rclone-remote '${{ github.event.inputs.rclone_remote || 'onedrive' }}'"
          ARGS="$ARGS --src-folder '${{ github.event.inputs.dst_folder }}'"
          ARGS="$ARGS --dst-folder '${{ github.event.inputs.dst_folder }}'"
          ARGS="$ARGS --timezone ${{ github.event.inputs.timezone || '9' }}"
          ARGS="$ARGS --enable-ai-tagging"
          ARGS="$ARGS --ai-confidence ${{ github.event.inputs.ai_confidence || '0.75' }}"
          ARGS="$ARGS --ai-cache-path /tmp/translation_cache.json"
          ARGS="$ARGS --create-xmp"
          ARGS="$ARGS --skip-existing"

          if [ "${{ github.event.inputs.deepl_free_tier }}" == "true" ]; then
            ARGS="$ARGS --deepl-free-tier"
          fi

          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          eval python onedrive_photo_fixer.py $ARGS

      - name: DeepL翻訳キャッシュを保存
        uses: actions/cache/save@v4
        if: always()
        with:
          path: /tmp/translation_cache.json
          key: deepl-cache-${{ github.repository }}-${{ hashFiles('onedrive-photo-migration/adaptive_vision_analyzer.py') }}

  # ─────────────────────────────────────────────────────────────────
  # Job 3: 完了通知
  # ─────────────────────────────────────────────────────────────────
  notify:
    name: 完了通知
    runs-on: ubuntu-latest
    needs: [extract-and-repair, ai-tagging]
    if: always()

    steps:
      - name: 結果サマリー
        run: |
          echo "## パイプライン結果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.extract-and-repair.result }}" == "success" ]; then
            echo "✅ **ZIP解凍・EXIF修復**: 成功" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **ZIP解凍・EXIF修復**: 失敗" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ github.event.inputs.enable_ai_tagging }}" == "true" ]; then
            if [ "${{ needs.ai-tagging.result }}" == "success" ]; then
              echo "✅ **AIタグ付け**: 成功" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ **AIタグ付け**: 失敗" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⏭️ **AIタグ付け**: スキップ (無効)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**出力先**: \`${{ github.event.inputs.dst_folder }}\`" >> $GITHUB_STEP_SUMMARY
